name: Build FrankensteinCore

on:
  push:
    branches:
      - main
      - Work/frankensteincore-1.2.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: mvn --batch-mode --no-transfer-progress clean package

      - uses: actions/upload-artifact@v4
        with:
          name: FrankensteinCore-1.2.0
          path: target/*.jar
          if-no-files-found: error
