name: FrankensteinCore
main: com.frankenstein.core.FrankensteinCore
version: "1.2.0"
api: ["1.0.0"]
author: FrankensteinTeam
description: Custom Nukkit-MOT Core

commands:
  home:
    description: Вернуться домой
    usage: "/home"
  sethome:
    description: Сохранить дом
    usage: "/sethome"
  delhome:
    description: Удалить дом
    usage: "/delhome"
  tpa:
    description: Запрос телепортации
    usage: "/tpa <игрок>"
  tpaccept:
    description: Принять запрос
    usage: "/tpaccept"
  tpdeny:
    description: Отклонить запрос
    usage: "/tpdeny"
  back:
    description: Вернуться назад
    usage: "/back"
  spawn:
    description: Вернуться на спавн
    usage: "/spawn"
  fly:
    description: Полёт
    usage: "/fly"
  v:
    description: Невидимость
    usage: "/v"
  gm:
    description: Изменить режим игры
    usage: "/gm <0-3>"
  mute:
    description: Выдать мут
    usage: "/mute <игрок>"
  unmute:
    description: Снять мут
    usage: "/unmute <игрок>"
  size:
    description: Изменить размер игрока
    usage: "/size <0.5|1.0|1.5|2.0|2.5|3.0|reset>"
